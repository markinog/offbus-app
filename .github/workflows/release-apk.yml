name: Release do APK

# Todo merge para a branch principal vira uma release com o APK anexado.
# Um merge de PR chega aqui como um push na branch de destino.
# A branch padrão hoje é master; main fica listada para o caso de renomear.
on:
  push:
    branches:
      - master
      - main

# Necessário para o gh criar a release e subir o asset
permissions:
  contents: write

# Dois merges seguidos não disputam a criação da release
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Clona o repositório
        uses: actions/checkout@v4

      # O daemon do Gradle pede JDK 21 (gradle/gradle-daemon-jvm.properties)
      # e o módulo compila com toolchain 17 (jvmToolchain no app/build.gradle.kts)
      - name: Instala os JDKs 17 e 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Prepara o Gradle
        uses: gradle/actions/setup-gradle@v4

      # O map.mbtiles tem 272 MB e não cabe no repositório: o GitHub recusa
      # arquivos acima de 100 MB. Hospede-o como asset de uma release fixa
      # (que aceita até 2 GB) e aponte o secret MAPA_MBTILES_URL para ele.
      - name: Baixa o mapa base
        env:
          MAPA_URL: ${{ secrets.MAPA_MBTILES_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build

          if [ -z "$MAPA_URL" ]; then
            echo "::error::Defina o secret MAPA_MBTILES_URL com a URL direta do map.mbtiles."
            exit 1
          fi

          # Asset de repositório privado exige token. O cabeçalho só vai quando a
          # URL é da API do GitHub, para o token nunca vazar a um host de terceiro.
          case "$MAPA_URL" in
            https://api.github.com/*)
              curl -fSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                "$MAPA_URL" -o build/map.mbtiles
              ;;
            *)
              curl -fSL "$MAPA_URL" -o build/map.mbtiles
              ;;
          esac

          tamanho=$(stat -c%s build/map.mbtiles)
          echo "map.mbtiles: $((tamanho / 1024 / 1024)) MB"

          # Uma URL errada costuma devolver uma página de erro em vez do arquivo
          if [ "$tamanho" -lt 10000000 ]; then
            echo "::error::Arquivo pequeno demais ($tamanho bytes) — a URL não aponta para o .mbtiles."
            exit 1
          fi

          # O conversor precisa do arquivo íntegro; um .mbtiles truncado só falha depois
          if ! head -c 15 build/map.mbtiles | grep -q "SQLite format"; then
            echo "::error::O arquivo baixado não é um banco SQLite."
            exit 1
          fi

      # O .mbtiles não vai mais para dentro do APK: o SQLite não abre um arquivo
      # de dentro do pacote, e era por isso que o app copiava os 272 MB para o
      # armazenamento na primeira execução. Os dois arquivos gerados aqui são
      # lidos por offset direto do APK, sem cópia nenhuma.
      - name: Converte o mapa para o formato do app
        run: |
          python3 tools/mbtiles_para_arquivo.py build/map.mbtiles app/src/main/assets

          for arquivo in map.tiles map.idx; do
            if [ ! -s "app/src/main/assets/$arquivo" ]; then
              echo "::error::A conversão não produziu app/src/main/assets/$arquivo."
              exit 1
            fi
          done

          ls -la app/src/main/assets/map.tiles app/src/main/assets/map.idx

      - name: Roda os testes de unidade
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Compila o APK
        # O bit de execução do gradlew se perde com facilidade em repositório
        # mexido no Windows, e o runner Linux recusa o arquivo com exit 126.
        # O chmod é redundante enquanto o modo estiver 100755 no git, mas evita
        # que a esteira volte a quebrar caso o arquivo seja readicionado.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Monta o nome da versão
        id: versao
        run: |
          # Mantém a tag em sincronia com o versionName declarado no Gradle
          versao=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
                   app/build.gradle.kts | head -1)

          if [ -z "$versao" ]; then
            echo "::error::Não encontrei versionName em app/build.gradle.kts."
            exit 1
          fi

          tag="v${versao}-build.${{ github.run_number }}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "arquivo=OffBus-${tag}.apk" >> "$GITHUB_OUTPUT"

          cp app/build/outputs/apk/debug/app-debug.apk "OffBus-${tag}.apk"
          ls -la "OffBus-${tag}.apk"

      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versao.outputs.tag }}
          ARQUIVO: ${{ steps.versao.outputs.arquivo }}
        run: |
          cat > notas.md <<'FIM'
          APK de teste gerado automaticamente a partir do último merge.

          ### Como instalar
          - Android 8.0 ou superior
          - Permitir "instalar de fontes desconhecidas" para o app que abrir o arquivo
          - O mapa é lido de dentro do próprio APK: não há cópia na primeira
            abertura, e o app ocupa no aparelho só o tamanho do arquivo instalado.

          > Build de depuração, assinado com a chave de debug do Android —
          > serve para testes, não para publicação em loja.
          FIM

          {
            echo ""
            echo "---"
            echo "Commit: ${{ github.sha }}"
          } >> notas.md

          gh release create "$TAG" "$ARQUIVO" \
            --title "OffBus $TAG" \
            --notes-file notas.md
